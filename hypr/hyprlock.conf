background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(203, 166, 247, 1.0)
    inner_color = rgba(30, 30, 46, 0.6)
    font_color = rgba(205, 214, 244, 1.0)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Enter password...</i>
    hide_input = false
    rounding = -1
    fail_color = rgba(243, 139, 168, 1.0)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    position = 0, -20
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(205, 214, 244, 1.0)
    font_size = 90
    font_family = Adwaita Sans
    position = 0, 100
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = Welcome back, $USER
    color = rgba(205, 214, 244, 0.8)
    font_size = 20
    font_family = Adwaita Sans
    position = 0, 30
    halign = center
    valign = center
}

# Keyboard Layout
label {
    monitor =
    text = $LAYOUT
    color = rgba(205, 214, 244, 0.6)
    font_size = 14
    font_family = Adwaita Sans
    position = 0, -80
    halign = center
    valign = center
}
