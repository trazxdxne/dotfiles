config_version = 2

[audio]
enable_sounds = false

[backdrop]
blur_intensity = 0.0
enabled = false

[bar]
order = [ "default", "bar" ]

    [bar.bar]
    auto_hide = false
    background_opacity = 0.99999997764825821
    border = "on_primary"
    capsule_radius = 6
    enabled = false
    end = []
    layer = "overlay"
    margin_edge = 8
    margin_ends = 930
    margin_opposite_edge = 6
    padding = 0
    reserve_space = false
    shadow = false
    show_on_workspace_switch = false
    start = []
    thickness = 25

    [bar.default]
    capsule = true
    capsule_radius = 12
    center = [ "clock" ]
    contact_shadow = true
    end = [
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "control-center",
        "session",
        "ram",
        "tray",
        "keyboard_layout",
        "notifications"
    ]
    font_family = "Adwaita Sans"
    margin_edge = 6
    margin_ends = 6
    panel_overlap = 1
    reserve_space = true
    shadow = false
    show_on_workspace_switch = false
    smart_auto_hide = false
    start = [ "launcher", "wallpaper", "workspaces" ]
    thickness = 30

        [bar.default.monitor.DP-1]

        [bar.default.monitor.HDMI-A-1]
        enabled = false

[calendar]
enabled = false

[control_center]
hidden_tabs = [ "power", "weather" ]
shortcuts = []
sidebar = "full"
sidebar_section = "compact"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
active_monitor_only = true
monitors = [ "DP-1" ]
radius = 12

[hooks]
logging_out = "/home/trazxdxne/dotfiles/scripts/graceful-session-exit"
rebooting = "/home/trazxdxne/dotfiles/scripts/graceful-session-exit"
shutting_down = "/home/trazxdxne/dotfiles/scripts/graceful-session-exit"

[lockscreen]
blurred_desktop = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@HDMI-A-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 64
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 120.0
    box_width = 384.0
    cx = 960.0
    cy = 600.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 32.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 1200.0
    cy = 720.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 256.0
    box_width = 512.0
    cx = 960.0
    cy = 412.0
    output = "DP-1"
    rotation = -0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        background_color = "on_primary"
        background_opacity = 0.33000000000000002
        background_padding = 12
        background_radius = 32
        center_text = true
        clock_style = "digital"
        color = "primary"
        shadow = false

[notification]
layer = "overlay"

[osd]
offset_x = 20
offset_y = 8
orientation = "horizontal"
position = "top_center"
position_vertical = "top_center"

    [osd.kinds]
    keyboard_layout = false

[plugin_settings."noctalia/true-transparency"]
transparency_panel_open_near_click = true
transparency_panel_placement = "floating"
transparency_panel_position = "auto"

[plugins]
enabled = []

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
niri_overview_type_to_launch_enabled = true
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true

    [shell.animation]
    speed = 4.0

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    app_grid = false
    categories = false
    compact = true
    session_search = false
    show_icons = true

    [shell.panel]
    control_center_placement = "attached"
    launcher_placement = "floating"
    launcher_position = "center"
    open_near_click_control_center = true
    open_near_click_session = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "solid"
    wallpaper_placement = "attached"

    [shell.screen_corners]
    size = 90

    [shell.shadow]
    alpha = 0.4999999888241291

[theme]
builtin = "Catppuccin"
community_palette = "Murata"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-rainbow"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "niri", "qt", "wezterm" ]
    community_ids = [ "obsidian", "zed", "antigravity", "telegram", "micro" ]

[wallpaper]
enabled = true
fill_mode = "fit"
transition_on_startup = false

    [wallpaper.default]
    path = "/home/trazxdxne/Pictures/Wallpapers/sasuke-uchiha-portrait-bi.jpg"

    [wallpaper.last]
    path = "/home/trazxdxne/Pictures/Wallpapers/sasuke-uchiha-portrait-bi.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/trazxdxne/Pictures/Wallpapers/sasuke-uchiha-portrait-bi.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/trazxdxne/Pictures/Wallpapers/sasuke-uchiha-portrait-bi.jpg"

[widget.bluetooth]
enabled = false

[widget.clipboard]
enabled = false

[widget.clock]
enabled = false
tooltip_format = "%A, %d %B %Y г."

[widget.control-center]
anchor = true
enabled = false

[widget.date]
enabled = true

[widget.keyboard_layout]
display = "short"
show_icon = false

    [widget.keyboard_layout.custom_labels]
    "English (US)" = "EN"
    Russian = "RU"

[widget.launcher]
enabled = false

[widget.network]
enabled = false

[widget.session]
enabled = false

[widget.spacer_2]
length = 141
type = "spacer"

[widget.transparent_widget]
color = "#000000"
enabled = true
type = "noctalia/true-transparency:transparent_widget"

[widget.wallpaper]
enabled = false

[widget.workspaces]
active_pill_size = 2.0
enabled = true