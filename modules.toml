[modules.network]
description = "Network bootstrap, DNS over TLS, Zapret, AmneziaWG and Game Split-Tunneling"
always = true
packages = []
distro_packages.arch = ["amneziawg-tools", "amneziawg-dkms"]
distro_packages.fedora = []

[modules.network.root_services]
enable = ["game-bypass-routing"]

[modules.base]
description = "Shell, terminal, base settings"
always = true
packages = ["fish", "wezterm", "fastfetch", "micro", "gum", "stow", "topgrade"]
distro_packages.arch = ["p7zip", "fresh-editor", "otf-geist-mono-nerd", "ayugram-desktop", "nodejs", "pnpm", "discord"]
distro_packages.fedora = ["p7zip", "p7zip-plugins"]

[modules.antigravity]
description = "Antigravity AI Agent configuration, skills and patcher"
packages = []
distro_packages.arch = ["python", "git"]
distro_packages.fedora = ["python3", "git"]

[modules.niri]
description = "Niri compositor"
packages = ["niri", "fuzzel"]
distro_packages.arch = ["xdg-desktop-portal-gnome", "rust"]
distro_packages.fedora = ["xdg-desktop-portal-gnome", "cargo"]

[modules.ags]
description = "AGS bar and widgets"
packages = ["ags"]

[modules.ags.user_services]
"ags.service" = ".config/systemd/user/ags.service"

[modules.greeter]
description = "Noctalia Greeter (greetd)"
packages = ["greetd"]
distro_packages.arch = ["noctalia-greeter"]
distro_packages.fedora = []

[modules.greeter.root_services]
enable = ["greetd"]

[modules.noctalia]
description = "Noctalia theming engine"
packages = ["noctalia"]

[modules.audio]
description = "Audio (WirePlumber, EasyEffects)"
packages = ["wireplumber", "pipewire", "easyeffects"]
distro_packages.arch = ["pipewire-pulse", "calf", "lsp-plugins-lv2"]
distro_packages.fedora = ["pipewire-pulseaudio", "calf", "lsp-plugins-lv2"]

[modules.audio.user_services]
"alsa-volume-restore.service" = ".config/systemd/user/alsa-volume-restore.service"

[modules.system-hw]
description = "System hardware (polkit, modprobe, systemd-oomd)"
packages = []
distro_packages.arch = []
distro_packages.fedora = []

[modules.system-hw.gpu_packages.amd.arch]
packages = ["vulkan-radeon", "mesa", "libva-mesa-driver", "amd-ucode"]

[modules.system-hw.gpu_packages.amd.fedora]
packages = ["mesa-vulkan-drivers", "mesa-dri-drivers", "mesa-va-drivers-freeworld", "microcode_ctl"]

[modules.system-hw.gpu_packages.nvidia.arch]
packages = ["nvidia", "nvidia-utils", "nvidia-settings"]

[modules.system-hw.gpu_packages.nvidia.fedora]
packages = ["akmod-nvidia", "xorg-x11-drv-nvidia-cuda"]

[modules.system-hw.root_services]
enable = ["systemd-oomd"]

[modules.syncthing]
description = "Syncthing file synchronization"
packages = ["syncthing"]

[modules.syncthing.user_services]
"syncthing.service" = ""

[modules.minecraft]
description = "Minecraft Server Management"
packages = []

[modules.zen]
description = "Zen Browser"
packages = []
