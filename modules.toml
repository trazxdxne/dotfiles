# Modules Configuration
# Managed by install.sh (Lean GNU Stow Overlay)

[modules.base]
description = "Core shell (Fish), terminal (WezTerm), micro editor, and base configs"
always = true
packages = ["fish", "wezterm", "fastfetch", "micro", "stow", "topgrade", "wl-clipboard", "libnotify", "7zip", "fresh-editor", "otf-geist-mono-nerd", "ayugram-desktop", "discord", "gnome-keyring", "brave-origin-bin", "fzf"]

[modules.niri]
description = "Niri Wayland scrollable-tiling compositor"
always = true
packages = ["niri", "fuzzel", "nautilus", "playerctl", "xdg-desktop-portal-gnome", "xwayland-satellite", "niri-autostart-bin"]

[modules.hyprland]
description = "Hyprland Wayland compositor (Omarchy & Arch ready)"
always = false
packages = ["hyprland", "hyprlock", "hypridle", "waybar", "fuzzel"]

[modules.noctalia]
description = "Noctalia desktop shell, bar, and unified theming engine"
always = true
packages = ["noctalia"]

[modules.audio]
description = "PipeWire and WirePlumber audio rules and volume fixes"
always = true
packages = ["pipewire", "wireplumber", "easyeffects", "pipewire-pulse"]

[modules.network]
description = "Unified network bypass controller (AmneziaWG, WARP, Zapret, Blocky DNS, game split-tunneling)"
always = true
packages = ["python", "curl", "zenity", "nftables"]

[modules.reshade]
description = "ReShade presets and Steam/Proton helpers (Dead by Daylight)"
always = true
packages = ["curl", "git", "7zip"]

[modules.zen]
description = "Zen Browser configuration"
always = false
packages = ["zen-browser-bin"]

[modules.antigravity]
description = "Antigravity AI Agent configuration, ECC bundle, and agent skills"
always = true
packages = ["python", "git", "nodejs"]

[modules.ags]
description = "AGS widgets and overlay clock (experimental / decoupled)"
always = false
packages = ["aylurs-gtk-shell"]
