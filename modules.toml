[modules.base]
description = "Shell, terminal, base settings"
always = true
packages = ["fish", "wezterm", "fastfetch", "micro", "topgrade", "gum", "stow"]
distro_packages.arch = []
distro_packages.fedora = []

[modules.base.user_services]
"graceful-session-exit.service" = ".config/systemd/user/graceful-session-exit.service"

[modules.niri]
description = "Niri compositor"
packages = ["niri", "fuzzel", "uwsm"]
distro_packages.arch = ["xdg-desktop-portal-gnome"]
distro_packages.fedora = []

[modules.niri.user_services]
"alsa-volume-restore.service" = ".config/systemd/user/alsa-volume-restore.service"

[modules.hyprland]
description = "Hyprland compositor"
packages = ["hyprland", "hyprlock"]

[modules.ags]
description = "AGS bar and widgets"
packages = ["ags"]

[modules.ags.user_services]
"ags.service" = ".config/systemd/user/ags.service"

[modules.greeter]
description = "Noctalia Greeter (greetd)"
packages = ["greetd"]
distro_packages.arch = ["greetd-noctalia"]
distro_packages.fedora = []

[modules.greeter.root_services]
enable = ["greetd"]

[modules.noctalia]
description = "Noctalia theming engine"
packages = ["noctalia"]

[modules.audio]
description = "Audio (WirePlumber)"
packages = ["wireplumber", "pipewire"]
distro_packages.arch = ["pipewire-pulse"]
distro_packages.fedora = ["pipewire-pulseaudio"]

[modules.system-hw]
description = "System hardware (polkit, modprobe, EDID, VNC, systemd-oomd)"
packages = ["wayvnc"]

[modules.system-hw.root_services]
enable = ["systemd-oomd"]

[modules.syncthing]
description = "Syncthing file synchronization"
packages = ["syncthing"]

[modules.syncthing.user_services]
"syncthing.service" = ""

[modules.minecraft]
description = "Minecraft Server Management"
packages = []

[modules.minecraft.user_services]
"minecraft-backup.timer" = ".config/systemd/user/minecraft-backup.timer"
"minecraft-backup.service" = ".config/systemd/user/minecraft-backup.service"

[modules.zen]
description = "Zen Browser"
packages = []
