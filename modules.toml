[modules.network]
description = "Network bootstrap, DNS over TLS, Zapret and Cloudflare WARP"
always = true
packages = []

[modules.base]
description = "Shell, terminal, base settings"
always = true
packages = ["fish", "wezterm", "fastfetch", "micro", "topgrade", "gum", "stow"]
distro_packages.arch = ["fresh-editor", "p7zip"]
distro_packages.fedora = ["fresh-editor", "p7zip", "p7zip-plugins"]

[modules.ai-skills]
description = "AI Agent skills and prompts"
packages = []

[modules.niri]
description = "Niri compositor"
packages = ["niri", "fuzzel"]
distro_packages.arch = ["xdg-desktop-portal-gnome"]
distro_packages.fedora = ["xdg-desktop-portal-gnome"]

[modules.hyprland]
description = "Hyprland compositor"
packages = ["hyprland", "hyprlock"]

[modules.ags]
description = "AGS bar and widgets"
packages = ["ags"]

[modules.ags.user_services]
"ags.service" = ".config/systemd/user/ags.service"

[modules.greeter]
description = "Noctalia Greeter (greetd)"
packages = ["greetd"]
distro_packages.arch = ["greetd-noctalia"]
distro_packages.fedora = []

[modules.greeter.root_services]
enable = ["greetd"]

[modules.noctalia]
description = "Noctalia theming engine"
packages = ["noctalia"]

[modules.audio]
description = "Audio (WirePlumber)"
packages = ["wireplumber", "pipewire"]
distro_packages.arch = ["pipewire-pulse"]
distro_packages.fedora = ["pipewire-pulseaudio"]

[modules.audio.user_services]
"alsa-volume-restore.service" = ".config/systemd/user/alsa-volume-restore.service"

[modules.system-hw]
description = "System hardware (polkit, modprobe, systemd-oomd)"
packages = []
distro_packages.arch = []
distro_packages.fedora = []

[modules.system-hw.gpu_packages.amd.arch]
packages = ["vulkan-radeon", "mesa", "libva-mesa-driver", "mesa-vdpau", "amd-ucode"]

[modules.system-hw.gpu_packages.amd.fedora]
packages = ["mesa-vulkan-drivers", "mesa-dri-drivers", "mesa-va-drivers-freeworld", "mesa-vdpau-drivers", "microcode_ctl"]

[modules.system-hw.gpu_packages.nvidia.arch]
packages = ["nvidia", "nvidia-utils", "nvidia-settings"]

[modules.system-hw.gpu_packages.nvidia.fedora]
packages = ["akmod-nvidia", "xorg-x11-drv-nvidia-cuda"]

[modules.system-hw.root_services]
enable = ["systemd-oomd"]

[modules.syncthing]
description = "Syncthing file synchronization"
packages = ["syncthing"]

[modules.syncthing.user_services]
"syncthing.service" = ""

[modules.minecraft]
description = "Minecraft Server Management"
packages = []

[modules.minecraft.user_services]
"minecraft-backup.timer" = ".config/systemd/user/minecraft-backup.timer"
"minecraft-backup.service" = ".config/systemd/user/minecraft-backup.service"

[modules.zen]
description = "Zen Browser"
packages = []
