[terminal]
vt = 1

[default_session]
command = "dbus-run-session sh -c 'export XCURSOR_THEME=ArchCursorComplete; export XCURSOR_SIZE=20; gsettings set org.gnome.desktop.interface cursor-theme \"ArchCursorComplete\"; gsettings set org.gnome.desktop.interface cursor-size 20; gsettings set org.gnome.desktop.interface gtk-theme \"Velvet-Night\"; gsettings set org.gnome.desktop.interface color-scheme \"prefer-dark\"; exec env GTK_THEME=Velvet-Night cage -s -- regreet'"
user = "greeter"
