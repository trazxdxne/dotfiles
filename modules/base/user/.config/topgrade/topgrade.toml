[misc]
disable = ["github_cli_skills"]

[git]
repos = [
    "~/Projects/*/",
    "~/.dotfiles"
]

[commands]
"Antigravity CLI" = "agypatch"
"niri-autostart" = "sh -c 'if command -v cargo >/dev/null 2>&1 && [ -d \"$HOME/Projects/niri-autostart\" ]; then git -C \"$HOME/Projects/niri-autostart\" pull --ff-only && cargo install --path \"$HOME/Projects/niri-autostart\" --root \"$HOME/.local\" --locked --force; fi'"
"Equicord" = "sh -c 'if command -v pnpm >/dev/null 2>&1 && [ -d \"$HOME/Programs/Equicord\" ]; then git -C \"$HOME/Projects/equicord-os-display-name\" pull --ff-only 2>/dev/null || true; git -C \"$HOME/Programs/Equicord\" checkout -- package.json pnpm-lock.yaml && git -C \"$HOME/Programs/Equicord\" pull --rebase && cp -f \"$HOME/Projects/equicord-os-display-name/osDisplayName.ts\" \"$HOME/Programs/Equicord/src/userplugins/osDisplayName.ts\" && cd \"$HOME/Programs/Equicord\" && COREPACK_ENABLE_STRICT=0 pnpm install && COREPACK_ENABLE_STRICT=0 pnpm build && echo | COREPACK_ENABLE_STRICT=0 pnpm inject; fi'"

[containers]
use_sudo = true
