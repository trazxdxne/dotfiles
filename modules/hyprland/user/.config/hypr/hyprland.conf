# Hyprland Configuration - Omarchy & Arch Ready
# Matches Niri workspace rules, bindings, and layout

# --- Monitors ---
monitor = DP-3, 1920x1080@200, 0x0, 1
monitor = , preferred, auto, 1

# --- Environment ---
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11,*
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# --- Autostart ---
exec-once = ~/.config/hypr/autostart.sh

# --- Input ---
input {
    kb_layout = us,ru
    kb_options = grp:caps_toggle,lv3:ralt_switch,misc:typo
    numlock_by_default = true

    follow_mouse = 1
    accel_profile = flat
    sensitivity = 0
}

# --- General Appearance & Layout ---
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(cba6f7ee) rgba(89b4faee) 45deg
    col.inactive_border = rgba(313244aa)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 12

    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = windows, 1, 4, easeOutQuint
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 6, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, easeOutQuint
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# --- Window Rules ---
# Workspace 1: Messengers (Tabbed Group) & Browser
windowrulev2 = workspace 1, class:^(com.ayugram.desktop)$
windowrulev2 = workspace 1, class:^(discord)$
windowrulev2 = group set, class:^(com.ayugram.desktop)$
windowrulev2 = group set, class:^(discord)$
windowrulev2 = workspace 1, class:^(brave-browser|brave-origin)$

# Workspace 2: Gaming & Launchers
windowrulev2 = workspace 2, class:^(steam)$
windowrulev2 = workspace 2, class:^(prismlauncher)$
windowrulev2 = workspace 2, class:^(minecraft)$
windowrulev2 = workspace 2, class:^(steam_app_381210)$
windowrulev2 = fullscreen, class:^(steam_app_381210)$
windowrulev2 = workspace 2, class:^(org.vinegarhq.Sober)$

# Floating windows
windowrulev2 = float, title:^(Picture.in.[pP]icture)$
windowrulev2 = float, title:^(Friends List)$
windowrulev2 = float, class:^(prismlauncher)$, title:^(?i)Console window.*$

# --- Keybindings ---
$mainMod = SUPER

# Applications & System
bind = $mainMod, Return, exec, wezterm start --always-new-process
bind = $mainMod, Space, exec, noctalia msg panel-toggle launcher || fuzzel
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, nautilus
bind = $mainMod, L, exec, noctalia msg session lock || hyprlock
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, Tab, togglefloating,

# Focus navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Moving windows
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Mouse workspace scrolling & window moving
bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Audio & Media Keys
bindl = $mainMod ALT, Z, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = $mainMod, mouse:274, exec, playerctl play-pause
bindl = $mainMod ALT, Space, exec, playerctl stop
bindl = $mainMod ALT, minus, exec, playerctl previous
bindl = $mainMod ALT, equal, exec, playerctl next
