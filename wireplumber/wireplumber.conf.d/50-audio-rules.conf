monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.pci-.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  },
  {
    matches = [
      { device.name = "~alsa_card.usb-.*" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = false
      }
    }
  }
]
